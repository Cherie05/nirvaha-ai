[build]
  command = "npm run build"
  publish = "out"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.(jpg|jpeg|png|svg|webp|ico|css|js)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
